services:
    website:
        build:
            context: ./website
            target: production
        ports:
            - "3000:3000"
        environment:
            API_URL: ${API_URL}
            API_KEY: ${API_KEY}
            DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
            DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
            EXPERIMENTAL_FEATURES_ENABLED: ${WEBSITE_EXPERIMENTAL_FEATURES_ENABLED}
            BOT_API_URL: ${BOT_API_URL}
        depends_on:
            api:
                condition: service_healthy
    bot:
        build:
            context: ./bot
            target: production
        depends_on:
            api:
                condition: service_healthy
        volumes:
            - ./bot/resources:/app/resources
            - bot_state:/app/.data
        restart: unless-stopped
        stop_grace_period: 30s
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 90s
        environment:
            API_URL: ${API_URL}
            API_KEY: ${API_KEY}
            JKLM_AUTH_TOKEN: ${JKLM_AUTH_TOKEN:-}
            JKLM_AUTH_USERNAME: ${JKLM_AUTH_USERNAME:-}
            JKLM_NICKNAME: ${JKLM_NICKNAME:-BirdBot}
            JKLM_LANGUAGE: ${JKLM_LANGUAGE:-en-US}
            NAMESPACE_UUID: ${NAMESPACE_UUID}
            BOT_STATE_DIR: /app/.data/room-checkpoints
    api:
        build:
            context: ./api
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
            interval: 1s
            timeout: 2s
            retries: 20
        environment:
            ENVIRONMENT: production
            DB_URL: ${DB_URL}
            API_KEY: ${API_KEY}
            DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
            DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
            DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
    db:
        image: postgres:13.18-alpine3.20
        volumes:
            - db_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 1s
            timeout: 2s
            retries: 20
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
    dozzle:
        image: amir20/dozzle:v10.9.0
        restart: unless-stopped
        ports:
            - "${DOZZLE_PORT:-8080}:8080"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - dozzle_data:/data
        secrets:
            - source: dozzle_users
              target: /data/users.yml
        environment:
            DOZZLE_AUTH_PROVIDER: simple
            DOZZLE_NO_ANALYTICS: "true"
            DOZZLE_ENABLE_ACTIONS: "false"
            DOZZLE_ENABLE_SHELL: "false"
            DOZZLE_HOSTNAME: birdbot
        healthcheck:
            test: ["CMD", "/dozzle", "healthcheck"]
            interval: 3s
            timeout: 30s
            retries: 5
            start_period: 30s
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

volumes:
    db_data:
    dozzle_data:
    bot_state:

secrets:
    dozzle_users:
        file: ./dozzle/users.yml
